<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -80 600 600" width="600" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .bot-1 { animation: float 3s ease-in-out infinite; }
    .bot-2 { animation: float 4s ease-in-out infinite 0.5s; }
    .bot-3 { animation: float 3.5s ease-in-out infinite 1s; }
    .energy-core { animation: pulse 2s ease-in-out infinite; }
    .code-flow { animation: spin 20s linear infinite; transform-origin: 300px 250px; }
    .status-dot { animation: pulse 2s ease-in-out infinite; }
  </style>

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="manuelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="botGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="botGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="botGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect x="0" y="-80" width="600" height="600" rx="18" fill="#0f172a"/>
  <rect x="6" y="-74" width="588" height="588" rx="14" fill="none" stroke="#2563eb" stroke-opacity="0.3" stroke-width="2"/>

  <text x="300" y="-38" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="middle">🤖 ManSoft AI Director</text>
  <text x="300" y="-14" font-size="14" font-weight="500" fill="#06b6d4" text-anchor="middle">Tú diriges, los bots programan</text>

  <g id="core">
    <circle cx="300" cy="250" r="60" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.3"/>
    <circle cx="300" cy="250" r="40" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5" class="code-flow"/>
    <circle cx="300" cy="250" r="30" fill="url(#manuelGrad)" filter="url(#glow)" class="energy-core"/>
    <circle cx="300" cy="250" r="20" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="257" font-size="22" font-weight="bold" fill="#2563eb" text-anchor="middle">M</text>
  </g>

  <g id="connections" stroke="#06b6d4" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5">
    <line x1="300" y1="250" x2="120" y2="120" class="code-flow"/>
    <line x1="300" y1="250" x2="480" y2="120" class="code-flow"/>
    <line x1="300" y1="250" x2="480" y2="380" class="code-flow"/>
  </g>

  <g class="bot-1">
    <circle cx="120" cy="120" r="35" fill="url(#botGrad1)" filter="url(#glow)"/>
    <rect x="100" y="105" width="40" height="30" fill="#0f172a" rx="3" stroke="#06b6d4" stroke-width="1"/>
    <text x="120" y="125" font-family="monospace" font-size="8" fill="#06b6d4" text-anchor="middle" opacity="0.8">BOT 1</text>
    <line x1="120" y1="85" x2="120" y2="70" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="68" r="3" fill="#06b6d4" opacity="0.7"/>
  </g>

  <g class="bot-2">
    <circle cx="480" cy="120" r="35" fill="url(#botGrad2)" filter="url(#glow)"/>
    <rect x="460" y="105" width="40" height="30" fill="#0f172a" rx="3" stroke="#10b981" stroke-width="1"/>
    <text x="480" y="125" font-family="monospace" font-size="8" fill="#10b981" text-anchor="middle" opacity="0.8">BOT 2</text>
    <line x1="480" y1="85" x2="480" y2="70" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="480" cy="68" r="3" fill="#10b981" opacity="0.7"/>
  </g>

  <g class="bot-3">
    <circle cx="480" cy="380" r="35" fill="url(#botGrad3)" filter="url(#glow)"/>
    <rect x="460" y="365" width="40" height="30" fill="#0f172a" rx="3" stroke="#f59e0b" stroke-width="1"/>
    <text x="480" y="385" font-family="monospace" font-size="8" fill="#f59e0b" text-anchor="middle" opacity="0.8">BOT 3</text>
    <line x1="480" y1="415" x2="480" y2="430" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="480" cy="432" r="3" fill="#f59e0b" opacity="0.7"/>
  </g>

  <text x="200" y="180" font-family="monospace" font-size="10" fill="#06b6d4" opacity="0.6">{'task': 'build'}</text>
  <text x="380" y="180" font-family="monospace" font-size="10" fill="#10b981" opacity="0.6">{'status': 'OK'}</text>
  <text x="380" y="350" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.6">{'deploy': '✓'}</text>

  <g id="status">
    <circle cx="140" cy="100" r="4" fill="#06b6d4" opacity="0.8" class="status-dot"/>
    <circle cx="460" cy="100" r="4" fill="#10b981" opacity="0.8" class="status-dot"/>
    <circle cx="460" cy="400" r="4" fill="#f59e0b" opacity="0.8" class="status-dot"/>
  </g>

  <g id="director-label">
    <text x="300" y="470" font-size="14" font-weight="600" fill="#06b6d4" text-anchor="middle">DIRECTOR</text>
    <text x="300" y="490" font-size="11" fill="#64748b" text-anchor="middle" opacity="0.8">Orquestando AI Agents</text>
  </g>
</svg>
